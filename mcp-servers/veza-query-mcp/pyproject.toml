[project]
name = "veza-query-mcp"
version = "0.1.0"
description = "Read-only MCP server for querying the Veza Access Graph with VQL"
readme = "README.md"
authors = [
    { name = "Arul Pandiyan. G", email = "arul.g@continube.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
]

[project.scripts]
veza-query-mcp = "veza_query_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Ship the lockfile and the test suite in the sdist. The tests run fully offline,
# so a recipient can verify the build without a Veza tenant — which is the whole
# point of handing this to someone else.
source-include = ["uv.lock", "tests/**", ".python-version", ".env.example"]
